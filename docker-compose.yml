services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kita_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitaplanung}
      POSTGRES_USER: ${POSTGRES_USER:-gis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streng_geheim_aendern}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis_admin} -d ${POSTGRES_DB:-kitaplanung}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    image: kita-service:latest
    container_name: kita_service
    restart: unless-stopped
    working_dir: /app
    command: ["uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-kitaplanung}
      DB_USER: ${POSTGRES_USER:-gis_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-streng_geheim_aendern}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app

  appsmith:
    image: index.docker.io/appsmith/appsmith-ce:latest
    container_name: kita_appsmith
    restart: unless-stopped
    ports:
      - "${APPSMITH_PORT:-8080}:80"
    volumes:
      - ./stacks:/appsmith-stacks
    depends_on:
      - api

volumes:
  pgdata: